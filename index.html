<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclo — Portal de Discipulado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --r:#C0392B;--rd:#922B21;--rl:#FADBD8;--r2:#F9EBEA;
  --g:#1E8449;--gl:#D5F5E3;
  --y:#B7950B;--yl:#FEF9E7;
  --o:#CA6F1E;--ol:#FDEBD0;
  --b:#1A5276;--bl:#D6EAF8;
  --ink:#0D1117;--ink2:#2C3E50;--muted:#95A5A6;
  --sur:#F7F8FA;--sur2:#EEF0F3;--white:#FFF;
  --bdr:#DDE1E7;
  --shadow:0 2px 16px rgba(0,0,0,.07);
  --shadow-lg:0 8px 40px rgba(0,0,0,.13);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--sur);color:var(--ink);min-height:100vh;overflow-x:hidden}

/* ─── HEADER ─── */
.hdr{
  background:linear-gradient(135deg,#7B241C 0%,var(--rd) 40%,var(--r) 100%);
  padding:0 32px;position:sticky;top:0;z-index:200;
  box-shadow:0 4px 24px rgba(146,43,33,.35);
}
.hdr-inner{max-width:1440px;margin:0 auto;height:64px;display:flex;align-items:center;gap:20px}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-cross{font-size:1.5rem;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.hdr-title{font-family:'Syne',sans-serif;font-size:1.2rem;color:#fff;letter-spacing:-.3px}
.hdr-sub{font-size:.72rem;color:rgba(255,255,255,.65);margin-top:1px}
.hdr-spacer{flex:1}
.hdr-search{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:24px;padding:7px 14px;transition:all .2s;
}
.hdr-search:focus-within{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.hdr-search input{background:transparent;border:none;outline:none;color:#fff;font-size:.85rem;font-family:'Inter',sans-serif;width:180px}
.hdr-search input::placeholder{color:rgba(255,255,255,.5)}
.hdr-search span{color:rgba(255,255,255,.5);font-size:.9rem}
.hdr-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 14px;font-size:.75rem;font-weight:700;color:#fff;white-space:nowrap}

/* ─── LAYOUT ─── */
.wrap{max-width:1440px;margin:0 auto;padding:28px 24px 60px}

/* ─── STAT CARDS ─── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.stat{
  background:var(--white);border-radius:16px;padding:20px 22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;cursor:default;
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0}
.stat.s-r::before{background:var(--r)}
.stat.s-g::before{background:var(--g)}
.stat.s-b::before{background:var(--b)}
.stat.s-y::before{background:var(--y)}
.stat.s-o::before{background:var(--o)}
.stat-icon{font-size:1.4rem;margin-bottom:10px}
.stat-val{font-family:'Syne',sans-serif;font-size:2.6rem;font-weight:800;line-height:1;margin-bottom:4px}
.stat.s-r .stat-val{color:var(--r)}
.stat.s-g .stat-val{color:var(--g)}
.stat.s-b .stat-val{color:var(--b)}
.stat.s-y .stat-val{color:var(--y)}
.stat.s-o .stat-val{color:var(--o)}
.stat-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}

/* ─── ROW PANELS ─── */
.panels{display:grid;grid-template-columns:1fr 1.6fr;gap:18px;margin-bottom:24px}
.panel{background:var(--white);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.panel-title::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* TOP LIST */
.top-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:4px}
.top-item:hover{background:var(--r2)}
.top-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:800;flex-shrink:0}
.top-rank.r1{background:#FFD700;color:#7D6608}
.top-rank.r2{background:#C0C0C0;color:#424242}
.top-rank.r3{background:#CD7F32;color:#5D4037}
.top-rank.rn{background:var(--sur2);color:var(--muted)}
.top-name{flex:1;font-weight:600;font-size:.88rem}
.top-bar-wrap{width:70px}
.top-bar-track{height:5px;background:var(--sur2);border-radius:10px;overflow:hidden}
.top-bar-fill{height:100%;border-radius:10px;transition:width .8s ease}
.top-pct{font-size:.78rem;font-weight:800;width:34px;text-align:right}

/* MOD BARS */
.mod-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mod-row-name{font-size:.78rem;font-weight:500;width:210px;flex-shrink:0;color:var(--ink2)}
.mod-track{flex:1;height:7px;background:var(--sur2);border-radius:20px;overflow:hidden}
.mod-fill{height:100%;border-radius:20px;transition:width 1s ease}
.mod-count{font-size:.72rem;font-weight:700;color:var(--muted);width:42px;text-align:right;white-space:nowrap}

/* ─── TOOLBAR ─── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--white);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif;color:var(--ink2)}
.fbtn:hover{border-color:var(--r);color:var(--r)}
.fbtn.on{background:var(--r);color:#fff;border-color:var(--r)}
.sort-select{padding:7px 12px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--white);font-size:.78rem;font-family:'Inter',sans-serif;color:var(--ink2);cursor:pointer;outline:none}
.spacer{flex:1}
.vtoggle{display:flex;gap:6px}
.vbtn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--white);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .18s}
.vbtn.on{background:var(--r);color:#fff;border-color:var(--r)}
.result-count{font-size:.78rem;color:var(--muted);font-weight:500}

/* ─── TABLE ─── */
.tbl-wrap{background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead th{
  background:var(--ink);color:#fff;padding:11px 13px;
  text-align:left;font-weight:600;font-size:.68rem;
  text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;position:sticky;top:0;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{background:#2C3E50}
thead th .sort-icon{margin-left:4px;opacity:.5}
thead th.asc .sort-icon::after{content:'↑'}
thead th.desc .sort-icon::after{content:'↓'}
thead th:not(.asc):not(.desc) .sort-icon::after{content:'↕'}
tbody tr{border-bottom:1px solid var(--sur2);transition:background .12s;cursor:pointer}
tbody tr:hover{background:#FDF5F5}
tbody tr:last-child{border:none}
td{padding:9px 13px;vertical-align:middle}
.td-num{color:var(--muted);font-weight:700;font-size:.72rem}
.td-nome{font-weight:600;font-size:.87rem}
.td-sub{font-size:.72rem;color:var(--muted);margin-top:1px}
.td-phone{font-size:.75rem}
.td-phone a{color:var(--g);text-decoration:none;display:flex;align-items:center;gap:4px}
.td-phone a:hover{text-decoration:underline}

/* Módulo dots */
.mdot{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;margin:1px;transition:transform .15s}
.mdot:hover{transform:scale(1.3);z-index:1;position:relative}
.mdot.done{background:var(--gl);color:var(--g);border:1.5px solid var(--g)}
.mdot.pend{background:var(--sur2);color:var(--bdr);border:1.5px solid var(--bdr)}

/* Progress */
.prog-cell{display:flex;align-items:center;gap:8px;min-width:100px}
.prog-track{flex:1;height:6px;background:var(--sur2);border-radius:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:10px;transition:width .6s ease}
.prog-lbl{font-size:.75rem;font-weight:800;width:32px}

/* Status badge */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap}
.b-done{background:var(--gl);color:var(--g)}
.b-high{background:var(--bl);color:var(--b)}
.b-mid{background:var(--yl);color:var(--y)}
.b-low{background:var(--ol);color:var(--o)}
.b-zero{background:var(--sur2);color:var(--muted)}

/* ─── CARDS VIEW ─── */
.cards-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cards-grid.on{display:grid}
.pcard{
  background:var(--white);border-radius:16px;padding:20px;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .2s,box-shadow .2s;
  border-left:4px solid var(--bdr);
  animation:fadeUp .3s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pcard.pc-done{border-left-color:var(--g)}
.pcard.pc-high{border-left-color:var(--b)}
.pcard.pc-mid{border-left-color:var(--y)}
.pcard.pc-low{border-left-color:var(--o)}
.pcard.pc-zero{border-left-color:var(--bdr)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.pc-name{font-weight:700;font-size:.95rem}
.pc-meta{font-size:.72rem;color:var(--muted);margin-bottom:12px}
.pc-dots{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px}
.pc-prog{display:flex;align-items:center;gap:8px}
.pc-track{flex:1;height:7px;background:var(--sur2);border-radius:10px;overflow:hidden}
.pc-fill{height:100%;border-radius:10px;transition:width .8s ease}
.pc-pct{font-size:.82rem;font-weight:800;width:36px;text-align:right}

/* ─── MODAL ─── */
.overlay{display:none;position:fixed;inset:0;background:rgba(13,17,23,.6);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.overlay.on{display:flex}
.modal{
  background:var(--white);border-radius:20px;
  max-width:580px;width:100%;max-height:92vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.25);
  animation:modalIn .25s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-top{
  background:linear-gradient(135deg,#7B241C,var(--r));
  padding:28px 28px 24px;border-radius:20px 20px 0 0;
  position:relative;
}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-close:hover{background:rgba(255,255,255,.35)}
.modal-nome{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:4px}
.modal-info{font-size:.8rem;color:rgba(255,255,255,.7)}
.modal-pct-row{display:flex;align-items:flex-end;gap:16px;margin-top:16px}
.modal-pct-big{font-family:'Syne',sans-serif;font-size:3.2rem;font-weight:800;color:#fff;line-height:1}
.modal-pct-sub{font-size:.78rem;color:rgba(255,255,255,.65);padding-bottom:8px}
.modal-prog-bar{height:6px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin-top:14px}
.modal-prog-fill{height:100%;background:rgba(255,255,255,.85);border-radius:10px;transition:width .8s ease}

.modal-body{padding:24px 28px}
.modal-wa{
  display:flex;align-items:center;gap:10px;
  background:#E9F5EC;border:1.5px solid #A9DFBF;border-radius:12px;
  padding:10px 14px;margin-bottom:20px;text-decoration:none;
  transition:background .15s;
}
.modal-wa:hover{background:#D5F5E3}
.modal-wa span{font-weight:600;color:var(--g);font-size:.88rem}
.modal-wa .wa-icon{font-size:1.3rem}
.modal-wa .wa-num{font-size:.78rem;color:var(--muted);margin-left:auto}

.mod-grid{display:flex;flex-direction:column;gap:6px}
.mod-row-modal{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:10px;
  transition:background .15s;cursor:pointer;
}
.mod-row-modal:hover{background:var(--sur)}
.mod-row-modal.m-done{background:var(--gl)}
.mod-row-modal.m-pend{background:var(--sur2)}
.mod-icon{font-size:1rem;width:24px;text-align:center;flex-shrink:0}
.mod-text{flex:1}
.mod-text-name{font-size:.85rem;font-weight:600}
.mod-row-modal.m-done .mod-text-name{color:var(--g)}
.mod-row-modal.m-pend .mod-text-name{color:var(--ink2)}
.mod-text-date{font-size:.72rem;margin-top:1px}
.mod-row-modal.m-done .mod-text-date{color:var(--g)}
.mod-row-modal.m-pend .mod-text-date{color:var(--muted)}
.mod-edit-btn{
  background:none;border:1.5px solid var(--bdr);border-radius:8px;
  padding:3px 8px;font-size:.68rem;font-weight:600;cursor:pointer;
  color:var(--muted);font-family:'Inter',sans-serif;transition:all .15s;
  white-space:nowrap;
}
.mod-edit-btn:hover{border-color:var(--r);color:var(--r)}
.mod-date-input{
  border:1.5px solid var(--r);border-radius:8px;padding:3px 8px;
  font-size:.78rem;font-family:'Inter',sans-serif;outline:none;
  color:var(--ink);background:var(--white);
}

/* ─── TOAST ─── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:.85rem;font-weight:500;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ─── EMPTY STATE ─── */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty-text{font-size:1rem;font-weight:600}
.empty-sub{font-size:.82rem;margin-top:6px}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .panels{grid-template-columns:1fr}
  .hdr-search{display:none}
}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hdr-title{font-size:1rem}
  .wrap{padding:16px 14px 48px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-logo">
      <span class="hdr-cross">✝️</span>
      <div>
        <div class="hdr-title">Ciclo de Discipulado</div>
        <div class="hdr-sub">Carazinho · 2026</div>
      </div>
    </div>
    <div class="hdr-spacer"></div>
    <div class="hdr-search">
      <span>🔍</span>
      <input type="text" id="hdrSearch" placeholder="Buscar participante...">
    </div>
    <div class="hdr-badge" id="hdrBadge">57 participantes</div>
  </div>
</header>

<div class="wrap">

<!-- STAT CARDS -->
<div class="stats">
  <div class="stat s-r"><div class="stat-icon">👥</div><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat s-g"><div class="stat-icon">✅</div><div class="stat-val" id="sDone">0</div><div class="stat-lbl">Concluídos</div></div>
  <div class="stat s-b"><div class="stat-icon">🔵</div><div class="stat-val" id="sHigh">0</div><div class="stat-lbl">Acima 75%</div></div>
  <div class="stat s-y"><div class="stat-icon">🟡</div><div class="stat-val" id="sMid">0</div><div class="stat-lbl">Em Andamento</div></div>
  <div class="stat s-o"><div class="stat-icon">📊</div><div class="stat-val" id="sAvg">0%</div><div class="stat-lbl">Média Geral</div></div>
</div>

<!-- PANELS -->
<div class="panels">
  <div class="panel">
    <div class="panel-title">🏆 Mais avançados</div>
    <div id="topList"></div>
  </div>
  <div class="panel">
    <div class="panel-title">📚 Progresso por módulo</div>
    <div id="modBars"></div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="filter-group">
    <button class="fbtn on" onclick="setFilter('all',this)">Todos</button>
    <button class="fbtn" onclick="setFilter('done',this)">✅ 100%</button>
    <button class="fbtn" onclick="setFilter('high',this)">🔵 +75%</button>
    <button class="fbtn" onclick="setFilter('mid',this)">🟡 50-74%</button>
    <button class="fbtn" onclick="setFilter('low',this)">🟠 -50%</button>
  </div>
  <select class="sort-select" id="sortSel" onchange="render()">
    <option value="n">Ordenar: Nº</option>
    <option value="nome">Ordenar: Nome</option>
    <option value="pct-desc">Ordenar: Maior %</option>
    <option value="pct-asc">Ordenar: Menor %</option>
  </select>
  <span class="result-count" id="resCount"></span>
  <div class="spacer"></div>
  <div class="vtoggle">
    <button class="vbtn on" id="btnT" onclick="setView('table')" title="Tabela">☰</button>
    <button class="vbtn" id="btnC" onclick="setView('cards')" title="Cards">⊞</button>
  </div>
</div>

<!-- TABLE -->
<div class="tbl-wrap" id="tblWrap">
  <table>
    <thead>
      <tr>
        <th>Nº</th>
        <th class="sortable" onclick="sortBy('nome')">Nome<span class="sort-icon"></span></th>
        <th>WhatsApp</th>
        <th title="Aliança de Sangue">A.S</th>
        <th title="Relacionando-me com o Pai">R.P</th>
        <th title="Cinco Ministérios">5M</th>
        <th title="Autoridade Espiritual">A.E</th>
        <th title="Panorama da Obra Divina">P.O</th>
        <th title="Mente Renova">M.R</th>
        <th title="Batalha Espiritual">B.E</th>
        <th title="Perdão">Pd</th>
        <th title="Dízimo">Dz</th>
        <th title="Espírito Santo">E.S</th>
        <th title="Grupo Familiar">G.F</th>
        <th title="Batismo nas Águas">B.A</th>
        <th class="sortable" onclick="sortBy('pct')">Progresso<span class="sort-icon"></span></th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- CARDS -->
<div class="cards-grid" id="cardsGrid"></div>

</div><!-- /wrap -->

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const MODULOS=[
  "Aliança de Sangue","Relacionando-me com o Pai","Cinco Ministérios",
  "Autoridade Espiritual","Panorama da Obra Divina","Mente Renova",
  "Batalha Espiritual","Perdão","Dízimo","Espírito Santo",
  "Grupo Familiar","Batismo nas Águas"

// Load edits from localStorage
const STORE_KEY = 'ciclo_edits';
let edits = JSON.parse(localStorage.getItem(STORE_KEY)||'{}');

function getData() {
  return RAW.map(p=>{
    const e = edits[p.n];
    if (!e) return {...p, modulos:{...p.modulos}};
    const mods = {...p.modulos, ...e};
    const done = MODULOS.filter(m=>mods[m]).length;
    return {...p, modulos:mods, pct:Math.round(done/12*100)};
  });
}

let DADOS = getData();
let curFilter='all', curSort='n', curView='table';
let sortDir={nome:1,pct:-1};

function pctColor(p){return p>=100?'#1E8449':p>=75?'#1A5276':p>=50?'#B7950B':'#CA6F1E'}
function statusCls(p){return p>=100?'done':p>=75?'high':p>=50?'mid':'low'}
function badge(p){
  const m={done:['b-done','✅ Concluído'],high:['b-high','🔵 Avançado'],mid:['b-mid','🟡 Em Andamento'],low:['b-low','🟠 Iniciado'],zero:['b-zero','⬜ Início']};
  const k=p>=100?'done':p>=75?'high':p>=50?'mid':p>0?'low':'zero';
  return `<span class="badge ${m[k][0]}">${m[k][1]}</span>`;
}
function waLink(cel){
  if(!cel)return'';
  const n=cel.replace(/\D/g,'');
  return `https://wa.me/${n}`;
}

function initDashboard(){
  DADOS=getData();
  const t=DADOS.length, dn=DADOS.filter(p=>p.pct>=100).length;
  const hi=DADOS.filter(p=>p.pct>=75&&p.pct<100).length;
  const mi=DADOS.filter(p=>p.pct>=50&&p.pct<75).length;
  const av=Math.round(DADOS.reduce((s,p)=>s+p.pct,0)/t);
  document.getElementById('sTotal').textContent=t;
  document.getElementById('sDone').textContent=dn;
  document.getElementById('sHigh').textContent=hi;
  document.getElementById('sMid').textContent=mi;
  document.getElementById('sAvg').textContent=av+'%';

  // Top 5
  const top=[...DADOS].sort((a,b)=>b.pct-a.pct).slice(0,5);
  document.getElementById('topList').innerHTML=top.map((p,i)=>`
    <div class="top-item" onclick="openModal(${p.n})">
      <div class="top-rank ${['r1','r2','r3','rn','rn'][i]}">${i+1}</div>
      <span class="top-name">${p.nome}</span>
      <div class="top-bar-wrap">
        <div class="top-bar-track"><div class="top-bar-fill" style="width:${p.pct}%;background:${pctColor(p.pct)}"></div></div>
      </div>
      <span class="top-pct" style="color:${pctColor(p.pct)}">${p.pct}%</span>
    </div>`).join('');

  // Mod bars
  document.getElementById('modBars').innerHTML=MODULOS.map(m=>{
    const cnt=DADOS.filter(p=>p.modulos[m]).length;
    const pct=Math.round(cnt/t*100);
    const c=pctColor(pct);
    return `<div class="mod-row">
      <span class="mod-row-name">${m}</span>
      <div class="mod-track"><div class="mod-fill" style="width:${pct}%;background:${c}"></div></div>
      <span class="mod-count">${cnt}/${t}</span>
    </div>`;
  }).join('');
}

function filtered(){
  const q=document.getElementById('hdrSearch').value.toLowerCase();
  let d=[...DADOS].filter(p=>{
    const ms=p.nome.toLowerCase().includes(q)||p.celular.includes(q);
    const mf=curFilter==='all'||statusCls(p.pct)===curFilter;
    return ms&&mf;
  });
  if(curSort==='n') d.sort((a,b)=>a.n-b.n);
  else if(curSort==='nome') d.sort((a,b)=>sortDir.nome*a.nome.localeCompare(b.nome));
  else if(curSort==='pct-desc') d.sort((a,b)=>b.pct-a.pct);
  else if(curSort==='pct-asc') d.sort((a,b)=>a.pct-b.pct);
  return d;
}

function render(){
  const d=filtered();
  document.getElementById('resCount').textContent=d.length===DADOS.length?`${d.length} participantes`:`${d.length} de ${DADOS.length}`;
  renderTable(d); renderCards(d);
}

function renderTable(d){
  if(!d.length){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="17"><div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Nenhum resultado</div><div class="empty-sub">Tente outro nome ou filtro</div></div></td></tr>`;
    return;
  }
  document.getElementById('tbody').innerHTML=d.map(p=>{
    const c=pctColor(p.pct);
    const wa=p.celular?`<a href="${waLink(p.celular)}" target="_blank" onclick="event.stopPropagation()">📱 ${p.celular}</a>`:'-';
    const dots=MODULOS.map((m,i)=>{
      const done=!!p.modulos[m];
      return `<span class="mdot ${done?'done':'pend'}" title="${m}${done?' — '+p.modulos[m]:''}">${ABBR[i]}</span>`;
    }).join('');
    return `<tr onclick="openModal(${p.n})">
      <td class="td-num">${p.n}</td>
      <td><div class="td-nome">${p.nome}</div><div class="td-sub">Retiro: ${p.retiro||'—'}</div></td>
      <td class="td-phone">${wa}</td>
      ${MODULOS.map(m=>`<td style="text-align:center">${p.modulos[m]?`<span style="color:var(--g);font-size:1.1rem">✓</span>`:`<span style="color:var(--bdr)">·</span>`}</td>`).join('')}
      <td><div class="prog-cell"><div class="prog-track"><div class="prog-fill" style="width:${p.pct}%;background:${c}"></div></div><span class="prog-lbl" style="color:${c}">${p.pct}%</span></div></td>
      <td>${badge(p.pct)}</td>
    </tr>`;
  }).join('');
}

function renderCards(d){
  const g=document.getElementById('cardsGrid');
  if(!d.length){g.innerHTML=`<div style="grid-column:1/-1"><div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Nenhum resultado</div></div></div>`;return;}
  g.innerHTML=d.map((p,idx)=>{
    const c=pctColor(p.pct);
    const dots=MODULOS.map((m,i)=>{const done=!!p.modulos[m];return`<span class="mdot ${done?'done':'pend'}" title="${m}">${ABBR[i]}</span>`;}).join('');
    return `<div class="pcard pc-${statusCls(p.pct)}" onclick="openModal(${p.n})" style="animation-delay:${idx*0.03}s">
      <div class="pc-head"><div><div class="pc-name">${p.nome}</div></div>${badge(p.pct)}</div>
      <div class="pc-meta">nº${p.n} · ${p.celular||'Sem telefone'}</div>
      <div class="pc-dots">${dots}</div>
      <div class="pc-prog"><div class="pc-track"><div class="pc-fill" style="width:${p.pct}%;background:${c}"></div></div><span class="pc-pct" style="color:${c}">${p.pct}%</span></div>
    </div>`;
  }).join('');
}

function openModal(n){
  const p=DADOS.find(x=>x.n===n);
  if(!p)return;
  const c=pctColor(p.pct);
  const done=MODULOS.filter(m=>p.modulos[m]).length;
  const wa=p.celular?`<a class="modal-wa" href="${waLink(p.celular)}" target="_blank">
    <span class="wa-icon">💬</span><span>Abrir WhatsApp</span><span class="wa-num">${p.celular}</span>
  </a>`:'';
  const mods=MODULOS.map((m,i)=>{
    const d=p.modulos[m];
    return `<div class="mod-row-modal ${d?'m-done':'m-pend'}" id="mrow_${n}_${i}">
      <span class="mod-icon">${d?'✅':'⬜'}</span>
      <div class="mod-text">
        <div class="mod-text-name">${m}</div>
        <div class="mod-text-date" id="mdate_${n}_${i}">${d||'Pendente'}</div>
      </div>
      <button class="mod-edit-btn" onclick="event.stopPropagation();toggleEdit(${n},${i},'${m}')" id="medit_${n}_${i}">${d?'Editar':'+ Data'}</button>
    </div>`;
  }).join('');

  document.getElementById('modal').innerHTML=`
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-nome">${p.nome}</div>
      <div class="modal-info">nº${p.n} · Retiro: ${p.retiro||'—'}</div>
      <div class="modal-pct-row">
        <div><div class="modal-pct-big" style="color:#fff">${p.pct}%</div><div class="modal-pct-sub">${done} de 12 módulos concluídos</div></div>
        ${badge(p.pct)}
      </div>
      <div class="modal-prog-bar"><div class="modal-prog-fill" style="width:${p.pct}%"></div></div>
    </div>
    <div class="modal-body">
      ${wa}
      <div class="panel-title" style="margin-bottom:14px">📋 Módulos</div>
      <div class="mod-grid">${mods}</div>
    </div>`;
  document.getElementById('overlay').classList.add('on');
}

function toggleEdit(n,i,modName){
  const row=document.getElementById(`mrow_${n}_${i}`);
  const dateEl=document.getElementById(`mdate_${n}_${i}`);
  const btn=document.getElementById(`medit_${n}_${i}`);
  const existing=row.querySelector('.mod-date-input');
  if(existing){existing.remove();btn.textContent=DADOS.find(x=>x.n===n).modulos[modName]?'Editar':'+ Data';return;}

  const inp=document.createElement('input');
  inp.type='text'; inp.placeholder='DD/MM/AAAA'; inp.className='mod-date-input';
  const cur=DADOS.find(x=>x.n===n).modulos[modName];
  if(cur)inp.value=cur;
  inp.onclick=e=>e.stopPropagation();
  inp.onkeydown=e=>{
    if(e.key==='Enter'){saveEdit(n,modName,inp.value.trim(),i);inp.remove();btn.textContent='Editar';}
    if(e.key==='Escape'){inp.remove();btn.textContent=cur?'Editar':'+ Data';}
  };
  btn.after(inp);
  btn.textContent='✓ Salvar';
  btn.onclick=e=>{e.stopPropagation();saveEdit(n,modName,inp.value.trim(),i);inp.remove();btn.textContent='Editar';};
  inp.focus();
}

function saveEdit(n,modName,val,i){
  if(!edits[n])edits[n]={};
  edits[n][modName]=val||null;
  localStorage.setItem(STORE_KEY,JSON.stringify(edits));
  DADOS=getData();
  const p=DADOS.find(x=>x.n===n);
  const done=!!p.modulos[modName];
  const row=document.getElementById(`mrow_${n}_${i}`);
  const dateEl=document.getElementById(`mdate_${n}_${i}`);
  row.className=`mod-row-modal ${done?'m-done':'m-pend'}`;
  row.querySelector('.mod-icon').textContent=done?'✅':'⬜';
  row.querySelector('.mod-text-name').style.color='';
  dateEl.textContent=val||'Pendente';
  // Update pct in modal top
  const doneCnt=MODULOS.filter(m=>p.modulos[m]).length;
  document.querySelector('.modal-pct-big').textContent=p.pct+'%';
  document.querySelector('.modal-pct-sub').textContent=`${doneCnt} de 12 módulos concluídos`;
  document.querySelector('.modal-prog-fill').style.width=p.pct+'%';
  initDashboard(); render();
  showToast(`✅ ${modName} atualizado`);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function closeModal(){document.getElementById('overlay').classList.remove('on')}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeModal()}
function setFilter(f,btn){
  curFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}
function sortBy(col){
  curSort=col; sortDir[col]*=-1; render();
}
function setView(v){
  curView=v;
  document.getElementById('btnT').classList.toggle('on',v==='table');
  document.getElementById('btnC').classList.toggle('on',v==='cards');
  document.getElementById('tblWrap').style.display=v==='table'?'block':'none';
  const cg=document.getElementById('cardsGrid');
  cg.style.display=v==='cards'?'grid':'none';
  if(v==='cards')cg.classList.add('on');
}
document.getElementById('hdrSearch').addEventListener('input',render);
document.getElementById('sortSel').addEventListener('change',e=>{curSort=e.target.value;render()});

initDashboard();
render();
</script>
</body>
</html>
